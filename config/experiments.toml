[global]
treatment_node = "t"
outcome_node = "y"
conditional_nodes = []
random_seed = 43
data_path = "data/"
raw_data_file = "raw.csv"
outputs_path = "outputs/"
data_ranges = "config/data_ranges.json"

[experiments.real]
dag = "dag-real"
adjustment_set = "BACKDOOR_EFFICIENT"
estimators = ["LinearOLSPoly"]

[experiments.naive]
dag = "dag-naive"
adjustment_set = "BACKDOOR_EFFICIENT"
estimators = ["OLS_SPLINE", "GPS", "SLearner"]

